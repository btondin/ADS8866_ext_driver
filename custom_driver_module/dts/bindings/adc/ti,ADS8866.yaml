# ADS8866 YAML binding file
# SPDX-License-Identifier: Apache-2.0
description: ADS8866 16-bit ADC

compatible: "ti,custom-ads8866"

# Includes standard definitions (which already define the child-binding)
include: [adc-controller.yaml, spi-device.yaml]

on-bus: spi


properties:
  "#io-channel-cells":
    const: 1
    
  convst-gpios:
    type: phandle-array
    required: true
    description: "GPIO pin for CONVST (Conversion Start)"

io-channel-cells:
  - input